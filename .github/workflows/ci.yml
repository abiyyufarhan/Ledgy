name: Ledgy CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_android:
        description: Build signed APK and AAB using the android-release environment
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ledgy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  desktop:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows
            bundle: build/windows/x64/runner/Release
          - os: ubuntu-24.04
            target: linux
            bundle: build/linux/x64/release/bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # Public client configuration only; RLS and Auth protect user data.
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: flutter build windows --release --no-pub --no-tree-shake-icons "--dart-define=SUPABASE_URL=$env:SUPABASE_URL" "--dart-define=SUPABASE_ANON_KEY=$env:SUPABASE_ANON_KEY"
      - name: Verify Windows icon font
        if: matrix.target == 'windows'
        run: node tool/verify_windows_icons.mjs
      - name: Build Linux
        if: matrix.target == 'linux'
        run: flutter build linux --release --no-pub --dart-define="SUPABASE_URL=$SUPABASE_URL" --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
      - name: Archive Linux with executable permissions
        if: matrix.target == 'linux'
        run: tar -czf ledgy-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - if: matrix.target == 'linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ledgy-linux-x64
          path: ledgy-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14
      - if: matrix.target == 'windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ledgy-windows-x64
          path: ${{ matrix.bundle }}/
          if-no-files-found: error
          retention-days: 14

  android-check:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # Pull requests never receive signing secrets. This is NOT a release APK.
      - run: flutter build apk --debug --no-pub

  android-release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_android
    needs: quality
    runs-on: ubuntu-24.04
    environment: android-release
    timeout-minutes: 60
    env:
      LEDGY_KEYSTORE_BASE64: ${{ secrets.LEDGY_KEYSTORE_BASE64 }}
      LEDGY_KEY_ALIAS: ${{ secrets.LEDGY_KEY_ALIAS }}
      LEDGY_STORE_PASSWORD: ${{ secrets.LEDGY_STORE_PASSWORD }}
      LEDGY_KEY_PASSWORD: ${{ secrets.LEDGY_KEY_PASSWORD }}
      LEDGY_KEYSTORE_PATH: ${{ runner.temp }}/ledgy-upload.jks
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Restore private upload key
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          required = ['LEDGY_KEYSTORE_BASE64', 'LEDGY_KEY_ALIAS', 'LEDGY_STORE_PASSWORD', 'LEDGY_KEY_PASSWORD']
          if any(not os.environ.get(name) for name in required):
              raise SystemExit('Configure all Android signing secrets in android-release first.')
          path = pathlib.Path(os.environ['LEDGY_KEYSTORE_PATH'])
          path.write_bytes(base64.b64decode(os.environ['LEDGY_KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          PY
      - run: flutter pub get --enforce-lockfile
      - name: Build signed APK
        run: flutter build apk --release --no-pub --dart-define="SUPABASE_URL=$SUPABASE_URL" --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
      - name: Build signed App Bundle
        run: flutter build appbundle --release --no-pub --dart-define="SUPABASE_URL=$SUPABASE_URL" --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
      - name: Verify APK and AAB signatures
        run: |
          apksigner_path=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$apksigner_path"
          "$apksigner_path" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab
          mkdir -p build/release-checksums
          sha256sum build/app/outputs/flutter-apk/app-release.apk build/app/outputs/bundle/release/app-release.aab > build/release-checksums/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ledgy-android-signed
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/release-checksums/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Remove private upload key
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib
          pathlib.Path(os.environ['LEDGY_KEYSTORE_PATH']).unlink(missing_ok=True)
          PY
